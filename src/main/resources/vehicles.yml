vehicles:
  fuel:
    max: 10000
    price_per_unit: 6.0
  fuel_stations:
    list:
      central:
        name: "&eStation essence"
        terminal:
          world: "world"
          x: -499.49
          y: 72.0
          z: 365.0
          radius: 4.0
  mechanic:
    breakdown_impacts: 8
  require_ownership: true
  # Donnés automatiquement à un joueur n'ayant encore aucun véhicule.
  # Laisse vide si tu veux forcer l'achat via le concessionnaire.
  default_owned: []
  provider:
    # Commande pour spawn le véhicule (ex: QAV2).
    # Variables: %vehicle%, %player%, %world%, %x%, %y%, %z%
    # sender: auto|player|console
    spawn_command: "qav spawnVehicle %vehicle%"
    sender: "auto"
  garages:
    central:
      name: "&eGarage Central"
      terminal:
        world: "world"
        x1: -502.0
        y1: 72.0
        z1: 382.0
        x2: -496.0
        y2: 72.0
        z2: 376.0
      spawn:
        # Le joueur doit être près de ce point pour sortir un véhicule.
        world: "world"
        x: -506.5
        y: 72.0
        z: 378.5
        radius: 3.0
        yaw: 0.0
        pitch: 0.0
  catalog:
    # IMPORTANT: `vehicle_id` doit correspondre EXACTEMENT au `name:` dans les .yml de QAV2.
