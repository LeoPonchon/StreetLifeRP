chat:
  proximity:
    enabled: true
    radius: 25.0
  me_radius: 25.0
  do_radius: 25.0
  ooc_radius: 35.0
  max_message_length: 200
  formats:
    local: "&7[%job%] &f%name%&7: &r%message%"
    me: "&d* &f%name%&d %message%"
    do: "&5* &f%message% &7(%name%)"
    ooc: "&8(( &7%name%&8: &7%message% &8))"
    tweet: "&b[TWT] &f@%name%&7: &f%message%"
    emergency: "&c[911] &f%name%&7: &f%message% &8(%world% %x% %y% %z%)"

phone:
  menu:
    title: "&eTéléphone"

vehicles:
  require_ownership: true
  provider:
    # Commande pour spawn le véhicule (ex: QAV2).
    # Variables: %vehicle%, %player%, %world%, %x%, %y%, %z%
    # sender: auto|player|console
    spawn_command: "qav spawnVehicle %vehicle%"
    sender: "auto"
  garages:
    central:
      name: "&eGarage Central"
      terminal:
        world: "world"
        x: 0.0
        y: 64.0
        z: 0.0
        radius: 4.0
      spawn:
        # Le joueur doit être près de ce point pour sortir un véhicule.
        world: "world"
        x: 2.0
        y: 64.0
        z: 2.0
        radius: 3.0
        yaw: 0.0
        pitch: 0.0
  catalog:
    demo_car:
      name: "&fVéhicule démo"
      vehicle_id: "demo_car"
      price: 5000.0
      icon: MINECART
