chat:
  proximity:
    enabled: true
    radius: 25.0
  me_radius: 25.0
  do_radius: 25.0
  ooc_radius: 35.0
  max_message_length: 200
  formats:
    local: "&7[%job%] &f%name%&7: &r%message%"
    me: "&d* &f%name%&d %message%"
    do: "&5* &f%message% &7(%name%)"
    ooc: "&8(( &7%name%&8: &7%message% &8))"
    tweet: "&b[TWT] &f@%name%&7: &f%message%"
    emergency: "&c[911] &f%name%&7: &f%message% &8(%world% %x% %y% %z%)"

phone:
  menu:
    title: "&eTéléphone"
  job_book:
    item_name: "&3Infos métier"
    item_lore:
      - "&8Clique pour ouvrir"
    title: "Infos métier"
    author: "StreetLifeRP"
    jobs:
      unemployed:
        pages:
          - "&8&lSans emploi\n\n&8Tu n'as pas de job.\n\n&8Demande à un admin pour être assigné à un métier."
      delivery:
        pages:
          - "&8&lLivreur\n\n&8Objectif:\n&7- Livrer des colis\n\n&8Astuce:\n&7- Reste en ville pour être dispo."
      baker:
        pages:
          - "&8&lBoulanger\n\n&8Objectif:\n&7- Produire/vendre de la nourriture\n\n&8Astuce:\n&7- Prépare du stock avant l'affluence."
          - "&8&lRecettes (table de craft)\n\n&8Shapeless:\n&7- Pain au chocolat:\n&7  BREAD + COCOA_BEANS\n\n&7- Sandwich:\n&7  BREAD + COOKED_BEEF + MILK_BUCKET\n\n&7- Café serré:\n&7  COCOA_BEANS + SUGAR + GLASS_BOTTLE"
      mechanic:
        pages:
          - "&8&lMécanicien\n\n&8Objectif:\n&7- Réparer/assister sur les véhicules\n\n&8Astuce:\n&7- Garde des kits de réparation."
          - "&8&lRecette: Kit de réparation\n\n&8Station: Table de craft (3x3)\n\n&7[I][R][I]\n&7[R][L][R]\n&7[I][R][I]\n\n&8I=&7IRON_INGOT\n&8R=&7REDSTONE\n&8L=&7LEVER"
      dealer:
        pages:
          - "&8&lDealer\n\n&8Objectif:\n&7- Commerce illégal\n\n&8Attention:\n&7- Risque Police / perquisitions."
          - "&8&lRecettes (table de craft)\n\n&8Shapeless:\n&7- Drogue de synthèse:\n&7  SUGAR + REDSTONE + GLOWSTONE_DUST + GLASS_BOTTLE\n\n&7- Space cookie:\n&7  COCOA_BEANS + WHEAT + SUGAR + FERN"
      police:
        pages:
          - "&8&lPolice\n\n&8Objectif:\n&7- Maintenir l'ordre\n\n&8Outils:\n&7- Kit Police dans le téléphone."
      ems:
        pages:
          - "&8&lEMS\n\n&8Objectif:\n&7- Soigner / réanimer\n\n&8Outils:\n&7- Kit EMS dans le téléphone."

